name: Update trial data

on:
  schedule:
    # Every 15 minutes. GitHub may delay scheduled runs when the queue is busy,
    # so treat this as "about every 15 minutes" rather than exact.
    - cron: "*/15 * * * *"
  workflow_dispatch:        # lets you trigger a run by hand from the Actions tab

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch weather from Ecowitt
        env:
          ECOWITT_APPLICATION_KEY: ${{ secrets.ECOWITT_APPLICATION_KEY }}
          ECOWITT_API_KEY: ${{ secrets.ECOWITT_API_KEY }}
          ECOWITT_MAC: ${{ secrets.ECOWITT_MAC }}
        run: python scripts/fetch_weather.py

      - name: Fetch manual logs from the trial Sheet
        env:
          SHEET_SUMMARY_URL: ${{ secrets.SHEET_SUMMARY_URL }}
        run: python scripts/fetch_manual.py

      - name: Commit if anything changed
        run: |
          git config user.name  "gilburn-park-bot"
          git config user.email "actions@users.noreply.github.com"
          if git diff --quiet -- data/latest.json; then
            echo "No change, nothing to commit."
          else
            git add data/latest.json
            git commit -m "Weather update $(date -u '+%Y-%m-%d %H:%MZ')"
            git push
          fi
